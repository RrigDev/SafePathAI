<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePath AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0f0f1a; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .hero { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
                min-height: 100vh; display: flex; align-items: center; }
        .card-glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
        .btn-primary { background: #e94560; border: none; padding: 12px 30px; border-radius: 8px; }
        .btn-primary:hover { background: #c73652; }
        .btn-outline { border: 1px solid #e94560; color: #e94560; background: transparent;
                       padding: 12px 30px; border-radius: 8px; }
        .btn-outline:hover { background: #e94560; color: white; }
        input.form-control { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
                             color: white; padding: 14px; border-radius: 8px; font-size: 16px; }
        input.form-control::placeholder { color: rgba(255,255,255,0.4); }
        input.form-control:focus { background: rgba(255,255,255,0.12); border-color: #e94560;
                                   color: white; box-shadow: none; }
    </style>
</head>
<body>
<section class="hero">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7 text-center">

                <h1 class="fw-bold mb-2" style="font-size:2.8rem;">
                    🛡️ SafePath <span style="color:#e94560;">AI</span>
                </h1>
                <p class="mb-5" style="color:rgba(255,255,255,0.6); font-size:1.1rem;">
                    Crime Risk Prediction & Safe Travel Planner
                </p>

                <div class="card-glass p-4">
                    <form action="/analyze" method="POST">
                        <div class="mb-3">
                            <input type="text" name="location" class="form-control"
                                   placeholder="🔍  Enter a location (e.g. Arekere, Bangalore)" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary fw-bold">
                                <i class="fas fa-shield-alt me-2"></i> Analyze Area
                            </button>
                            <button type="button" class="btn btn-outline fw-bold" onclick="getLocation()">
                                <i class="fas fa-location-crosshairs me-2"></i> Use My Current Location
                            </button>
                        </div>
                    </form>
                </div>

                <div class="row mt-4 text-center">
                    <div class="col-4">
                        <div class="card-glass p-3">
                            <div style="font-size:1.8rem;">📊</div>
                            <small style="color:rgba(255,255,255,0.6);">Crime Stats</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card-glass p-3">
                            <div style="font-size:1.8rem;">🗺️</div>
                            <small style="color:rgba(255,255,255,0.6);">Safe Routes</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card-glass p-3">
                            <div style="font-size:1.8rem;">🤖</div>
                            <small style="color:rgba(255,255,255,0.6);">AI Powered</small>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<script>
function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
            const coords = pos.coords.latitude + "," + pos.coords.longitude;
            document.querySelector('input[name="location"]').value = coords;
        });
    } else {
        alert("Geolocation is not supported by your browser.");
    }
}
</script>
</body>
</html>
